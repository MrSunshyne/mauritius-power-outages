# power-outages-mauritius.netlify.app was the first home of this app. It now only
# redirects to https://courant.ramgolam.com (built by Cloudflare Pages), so the app
# is not built here. Netlify serves the few files in netlify-redirect/ and sends
# every other path to the same path on courant.ramgolam.com with a 301; Netlify
# passes the query string along.
[build]
  command = "echo 'Redirect-only deploy: everything goes to https://courant.ramgolam.com'"
  publish = "netlify-redirect"

[[redirects]]
  from = "/*"
  to = "https://courant.ramgolam.com/:splat"
  status = 301

# Browsers re-check the service worker script; never let a cache hide the kill switch.
[[headers]]
  for = "/sw.js"
    [headers.values]
    Cache-Control = "no-cache"
